name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"     # the floor the plugin supports, not the latest
      - name: Run the plugin suite
        run: python3 -m unittest discover tests -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"     # the integration tests drive the real hooks
      - run: npm --prefix extension ci
      - name: Run vitest and the typechecker
        run: npm --prefix extension test
